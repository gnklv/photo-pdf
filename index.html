<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фото в PDF</title>
<meta name="description" content="Раскладывает фото по страницам и собирает PDF прямо в браузере">
<meta name="theme-color" content="#2f6fed">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png">
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1 data-i18n="heading">Фото → PDF</h1>
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <div class="drop" id="drop">
      <span class="mouse-only" data-i18n="dropMouse">Перетащите фото сюда
или нажмите, чтобы выбрать</span>
      <span class="touch-only" data-i18n="dropTouch">Нажмите, чтобы выбрать фото</span>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>

    <div class="fields">
      <label><span data-i18n="format">Формат</span>
        <select id="format">
          <option value="210x297">A4</option>
          <option value="148x210">A5</option>
          <option value="297x420">A3</option>
          <option value="215.9x279.4">Letter</option>
          <option value="102x152" data-i18n="size10x15">10×15 см</option>
        </select>
      </label>
      <label><span data-i18n="orientation">Ориентация</span>
        <select id="orient">
          <option value="p" data-i18n="portrait">Книжная</option>
          <option value="l" data-i18n="landscape">Альбомная</option>
        </select>
      </label>
      <label class="wide"><span data-i18n="perPage">Фото на странице</span>
        <input type="number" id="perPage" min="1" max="30" value="4">
      </label>
      <label><span data-i18n="margin">Поля, мм</span>
        <input type="number" id="margin" min="0" max="50" value="10">
      </label>
      <label><span data-i18n="gap">Отступ между фото, мм</span>
        <input type="number" id="gap" min="0" max="50" value="5">
      </label>
      <label class="wide"><span data-i18n="fit">Вписывание</span>
        <select id="fit">
          <option value="contain" data-i18n="fitContain">Целиком, без обрезки</option>
          <option value="cover" data-i18n="fitCover">Заполнить ячейку (с обрезкой)</option>
        </select>
      </label>
    </div>

    <div class="info">
      <span id="count">Нет фото</span>
      <button class="ghost" id="clear" data-i18n="clear" hidden>Очистить</button>
    </div>
    <div class="thumbs" id="thumbs"></div>

    <div class="spacer"></div>
    <button id="make" data-i18n="download" disabled>Скачать PDF</button>
  </aside>

  <main id="preview">
  </main>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
